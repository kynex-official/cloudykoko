<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudyKoko - Stream Cartoons</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Search Header */
    header {
      margin-bottom: 30px;
      position: sticky;
      top: 0;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 100;
      padding: 16px 0;
    }

    .search-box {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-box input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 9999px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box button {
      padding: 0 24px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 9999px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-box button:hover {
      background: var(--accent-hover);
    }

    /* Section Typography */
    h2 {
      font-size: 1.5rem;
      margin: 36px 0 16px 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Trending Banner */
    .trending-banner {
      width: 100%;
      height: 380px;
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .trending-overlay {
      width: 100%;
      padding: 40px;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent);
    }

    .trending-tag {
      background: var(--accent);
      color: #0f172a;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      display: inline-block;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .trending-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, background-color 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      background-color: var(--card-hover);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background-color: #334155;
    }

    .card-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .card-episodes {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Skeleton Loading Placeholder */
    .skeleton {
      background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
      background-size: 200% 100%;
      animation: pulse 1.5s infinite;
      border-radius: var(--radius);
    }

    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .banner-skeleton {
      width: 100%;
      height: 380px;
    }

    .card-skeleton {
      height: 350px;
    }

    /* Video Player Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .video-container {
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .episode-selector {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      border-top: 1px solid #334155;
    }

    .ep-pill {
      background: #334155;
      color: #fff;
      padding: 8px 16px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
    }

    .ep-pill.active {
      background: var(--accent);
      color: #0f172a;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search cartoons by title..." aria-label="Search cartoons">
        <button id="searchBtn">Search</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Trending Section -->
    <section id="trendingSection">
      <h2>Trending Now</h2>
      <div id="trendingWrapper">
        <div class="skeleton banner-skeleton"></div>
      </div>
    </section>

    <!-- Search Results (Hidden Initially) -->
    <section id="searchSection" style="display: none;">
      <h2>Search Results</h2>
      <div class="grid" id="searchGrid"></div>
    </section>

    <!-- Top Cartoons -->
    <section id="topSection">
      <h2>Top Cartoons</h2>
      <div class="grid" id="topGrid">
        <div class="skeleton card-skeleton"></div>
        <div class="skeleton card-skeleton"></div>
        <div class="skeleton card-skeleton"></div>
        <div class="skeleton card-skeleton"></div>
      </div>
    </section>

    <!-- Recently Uploaded -->
    <section id="recentSection">
      <h2>Recently Uploaded</h2>
      <div class="grid" id="recentGrid">
        <div class="skeleton card-skeleton"></div>
        <div class="skeleton card-skeleton"></div>
        <div class="skeleton card-skeleton"></div>
        <div class="skeleton card-skeleton"></div>
      </div>
    </section>
  </main>

  <!-- Player Modal -->
  <div class="modal" id="playerModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Playback</h3>
        <button class="close-btn" id="closeModal">&times;</button>
      </div>
      <div class="video-container">
        <video id="videoPlayer" controls autoplay></video>
      </div>
      <div class="episode-selector" id="episodeSelector"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://cloudykoko-api.kynexdeveloper.workers.dev";

    function getMediaStreamUrl(fileId) {
      return `${API_BASE}/api/media/stream?file_id=${encodeURIComponent(fileId)}`;
    }

    async function initUserPanel() {
      try {
        const res = await fetch(`${API_BASE}/api/user/bundle`);
        if (!res.ok) throw new Error("API Failure");
        const bundle = await res.json();

        renderTrending(bundle.trending);
        renderTopCartoons(bundle.topCartoons);
        renderRecentlyUploaded(bundle.recentlyUploaded);
      } catch (err) {
        document.getElementById("trendingWrapper").innerHTML = `
          <div class="empty-state">Unable to load cartoon stream. Please try again later.</div>
        `;
      }
    }

    function renderTrending(cartoon) {
      const container = document.getElementById("trendingWrapper");
      if (!cartoon) {
        container.innerHTML = `<div class="empty-state">No featured trending cartoon right now.</div>`;
        return;
      }

      const bannerUrl = cartoon.bannerMedia?.fileId
        ? getMediaStreamUrl(cartoon.bannerMedia.fileId)
        : "";

      container.innerHTML = `
        <div class="trending-banner" style="background-image: url('${bannerUrl}')" onclick="openCartoonPlayer('${cartoon.id}')">
          <div class="trending-overlay">
            <span class="trending-tag">Trending #1</span>
            <div class="trending-title">${cartoon.title}</div>
            <p>${(cartoon.episodes || []).length} Available Episodes</p>
          </div>
        </div>
      `;
    }

    function createCardElement(cartoon) {
      const card = document.createElement("div");
      card.className = "card";
      card.onclick = () => openCartoonPlayer(cartoon.id);

      const thumbUrl = cartoon.thumbnailMedia?.fileId
        ? getMediaStreamUrl(cartoon.thumbnailMedia.fileId)
        : "";

      card.innerHTML = `
        <img src="${thumbUrl}" alt="${cartoon.title}" loading="lazy">
        <div class="card-content">
          <div class="card-title">${cartoon.title}</div>
          <div class="card-episodes">${(cartoon.episodes || []).length} Episodes</div>
        </div>
      `;
      return card;
    }

    function renderTopCartoons(list) {
      const grid = document.getElementById("topGrid");
      grid.innerHTML = "";
      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="empty-state">No top cartoons currently designated.</div>`;
        return;
      }
      list.forEach((c) => grid.appendChild(createCardElement(c)));
    }

    function renderRecentlyUploaded(list) {
      const grid = document.getElementById("recentGrid");
      grid.innerHTML = "";
      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="empty-state">No recently uploaded cartoons found.</div>`;
        return;
      }
      list.forEach((c) => grid.appendChild(createCardElement(c)));
    }

    // Search Execution
    document.getElementById("searchBtn").addEventListener("click", executeSearch);
    document.getElementById("searchInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") executeSearch();
    });

    async function executeSearch() {
      const q = document.getElementById("searchInput").value.trim();
      const searchSection = document.getElementById("searchSection");
      const searchGrid = document.getElementById("searchGrid");

      if (!q) {
        searchSection.style.display = "none";
        return;
      }

      searchSection.style.display = "block";
      searchGrid.innerHTML = `<div class="skeleton card-skeleton"></div>`;

      try {
        const res = await fetch(`${API_BASE}/api/user/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        searchGrid.innerHTML = "";

        if (!data.results || data.results.length === 0) {
          searchGrid.innerHTML = `<div class="empty-state">No cartoons matched "${q}".</div>`;
          return;
        }

        data.results.forEach((c) => searchGrid.appendChild(createCardElement(c)));
      } catch {
        searchGrid.innerHTML = `<div class="empty-state">Search query failed. Check connectivity.</div>`;
      }
    }

    // Modal Video Playback
    let currentActiveCartoon = null;

    async function openCartoonPlayer(cartoonId) {
      try {
        const res = await fetch(`${API_BASE}/api/user/cartoon/${cartoonId}`);
        if (!res.ok) return;
        const cartoon = await res.json();
        currentActiveCartoon = cartoon;

        document.getElementById("modalTitle").innerText = cartoon.title;
        const selector = document.getElementById("episodeSelector");
        selector.innerHTML = "";

        if (!cartoon.episodes || cartoon.episodes.length === 0) {
          alert("No episodes uploaded for this cartoon yet.");
          return;
        }

        cartoon.episodes.forEach((ep, idx) => {
          const btn = document.createElement("button");
          btn.className = `ep-pill ${idx === 0 ? "active" : ""}`;
          btn.innerText = `Ep ${ep.episodeNumber}: ${ep.title}`;
          btn.onclick = () => selectEpisode(ep, btn);
          selector.appendChild(btn);
        });

        // Autoplay initial episode
        selectEpisode(cartoon.episodes[0], selector.children[0]);
        document.getElementById("playerModal").classList.add("active");
      } catch (err) {
        alert("Unable to open playback media.");
      }
    }

    function selectEpisode(ep, buttonElem) {
      document.querySelectorAll(".ep-pill").forEach((b) => b.classList.remove("active"));
      if (buttonElem) buttonElem.classList.add("active");

      const video = document.getElementById("videoPlayer");
      if (ep.media?.fileId) {
        video.src = getMediaStreamUrl(ep.media.fileId);
        video.play().catch(() => {});
      } else {
        alert("Episode video media reference is missing.");
      }
    }

    document.getElementById("closeModal").onclick = () => {
      const video = document.getElementById("videoPlayer");
      video.pause();
      video.src = "";
      document.getElementById("playerModal").classList.remove("active");
    };

    window.onload = initUserPanel;
  </script>
</body>
</html>
