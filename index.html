<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CloudyKoko — Watch Free Cartoons Online</title>
  <meta name="description" content="Stream your favorite cartoons online in high definition on CloudyKoko.">
  <style>
    :root {
      --bg-base: #080808;
      --bg-surface: #141414;
      --bg-card: #191919;
      --bg-card-hover: #242424;
      --bg-chip: #222222;
      --bg-chip-hover: #303030;
      --accent: #e50914;
      --accent-hover: #f6121d;
      --accent-glow: rgba(229, 9, 20, 0.4);
      --text-primary: #ffffff;
      --text-muted: #b3b3b3;
      --text-subtle: #757575;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-pill: 9999px;
      --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 280ms cubic-bezier(0.16, 1, 0.3, 1);
      --container-max: 1360px;
      --watch-player-max: 1180px;
    }

    /* Reset, GPU Performance, and Blue Tap Box Fix */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent !important; /* বাজে ব্লু বক্স সম্পূর্ণ রিমুভ */
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      background-color: var(--bg-base);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.4;
      transform: translateZ(0); /* হার্ডওয়্যার এক্সিলারেশন */
    }

    body.modal-open {
      overflow: hidden;
    }

    button, [role="button"], a {
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 clamp(16px, 3.5vw, 40px);
    }

    /* ==========================================================================
       HEADER & SEARCH WITH MICRO-ANIMATIONS
       ========================================================================== */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, rgba(8, 8, 8, 0.96) 0%, rgba(8, 8, 8, 0.88) 75%, transparent 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: clamp(12px, 2vw, 18px) 0;
      transition: background var(--transition-smooth);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-primary);
      font-size: clamp(1.25rem, 2.8vw, 1.75rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      user-select: none;
      flex-shrink: 0;
      transition: transform var(--transition-fast);
    }

    .brand-logo:hover {
      transform: scale(1.02);
    }

    .brand-logo:active {
      transform: scale(0.97);
    }

    .brand-logo .accent-word {
      color: var(--accent);
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .search-box {
      display: flex;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 480px;
      min-width: 0;
    }

    .search-input-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-input-wrap svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill var(--transition-fast), transform var(--transition-fast);
    }

    .search-box input {
      width: 100%;
      padding: 11px 40px 11px 42px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-box input:focus {
      background: rgba(20, 20, 20, 0.95);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-box input:focus + svg {
      fill: var(--accent);
      transform: scale(1.1);
    }

    .search-box input::placeholder {
      color: var(--text-subtle);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      transition: color var(--transition-fast), transform var(--transition-fast);
    }

    .search-clear-btn:hover {
      color: var(--text-primary);
      transform: scale(1.15);
    }

    .search-box button#searchBtn {
      display: none;
    }

    /* ==========================================================================
       BROWSE SECTIONS & CAROUSEL
       ========================================================================== */
    .catalog-section {
      margin-top: clamp(28px, 4vw, 44px);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h2 {
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-pill {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    /* Trending Hero Banner */
    .hero-container {
      position: relative;
      margin-top: 8px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background-color: var(--bg-surface);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
    }

    .trending-banner {
      width: 100%;
      min-height: 380px;
      height: clamp(380px, 46vw, 560px);
      position: relative;
      background-size: cover;
      background-position: center top;
      display: flex;
      align-items: flex-end;
      cursor: pointer;
      animation: bannerFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes bannerFade {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    .trending-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, #080808 0%, rgba(8, 8, 8, 0.75) 45%, rgba(8, 8, 8, 0.1) 80%, transparent 100%),
        linear-gradient(to right, rgba(8, 8, 8, 0.95) 0%, rgba(8, 8, 8, 0.6) 40%, transparent 80%);
      pointer-events: none;
    }

    .trending-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: clamp(20px, 4.5vw, 48px);
      max-width: 760px;
    }

    .trending-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 12px var(--accent-glow);
      margin-bottom: 12px;
      animation: pulseBadge 2.4s infinite ease-in-out;
    }

    @keyframes pulseBadge {
      0%, 100% { box-shadow: 0 4px 12px var(--accent-glow); }
      50% { box-shadow: 0 4px 20px rgba(229, 9, 20, 0.7); }
    }

    .trending-title {
      font-size: clamp(1.8rem, 4.5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
      overflow-wrap: anywhere;
    }

    .trending-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
    }

    .meta-highlight {
      color: #46d369;
      font-weight: 700;
    }

    /* Play Button with no blue box and smooth tap bounce */
    .btn-play-hero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--text-primary);
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      padding: 12px 28px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: background-color var(--transition-fast), transform var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .btn-play-hero:hover {
      background-color: rgba(255, 255, 255, 0.88);
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
    }

    .btn-play-hero:active {
      transform: scale(0.96); /* মোবাইল ট্যাপ বাউন্স */
    }

    .btn-play-hero svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Horizontal Carousels */
    .row-wrapper {
      position: relative;
    }

    .horizontal-row {
      display: flex;
      gap: clamp(14px, 1.8vw, 20px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 12px 0 22px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      -webkit-overflow-scrolling: touch;
      will-change: scroll-position;
    }

    .horizontal-row::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-row::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-pill);
    }

    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-60%);
      z-index: 10;
      width: 44px;
      height: 80px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      opacity: 0;
      transition: opacity var(--transition-fast), background var(--transition-fast), transform var(--transition-fast);
      backdrop-filter: blur(4px);
    }

    .row-wrapper:hover .carousel-nav-btn {
      opacity: 1;
    }

    .carousel-nav-btn:hover {
      background: rgba(229, 9, 20, 0.85);
      transform: translateY(-60%) scale(1.05);
    }

    .carousel-nav-btn:active {
      transform: translateY(-60%) scale(0.95);
    }

    .carousel-nav-btn.prev { left: -14px; }
    .carousel-nav-btn.next { right: -14px; }

    /* ==========================================================================
       16:9 CARTOON CARD COMPONENT & ENTRANCE ANIMATION
       ========================================================================== */
    .card {
      position: relative;
      flex: 0 0 clamp(210px, 25vw, 290px); /* 16:9 ওয়াইডস্ক্রিন কার্ড উইডথ */
      scroll-snap-align: start;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
      animation: cardEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      will-change: transform;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.85), 0 0 14px var(--accent-glow);
      border-color: rgba(229, 9, 20, 0.5);
    }

    .card:active {
      transform: scale(0.98);
    }

    /* 16:9 Thumbnail Aspect Ratio */
    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* নির্দেশ অনুযায়ী ১৬:৯ থাম্বনেইল */
      background: #151515;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform var(--transition-smooth), opacity 0.3s ease;
      opacity: 0;
    }

    .card img.loaded {
      opacity: 1;
    }

    .card:hover img {
      transform: scale(1.06);
    }

    .card-hover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--transition-fast);
    }

    .card:hover .card-hover-overlay {
      opacity: 1;
    }

    .play-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      transform: scale(0.85);
      transition: transform var(--transition-fast);
    }

    .card:hover .play-badge {
      transform: scale(1);
    }

    .card-content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .card-episodes {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-episodes::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    /* Search Results Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 24vw, 290px), 1fr));
      gap: clamp(14px, 2vw, 20px);
      padding: 12px 0 24px 0;
    }

    .grid .card { flex: initial; }

    .search-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-clear-search {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border: none;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .btn-clear-search:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.02);
    }

    .btn-clear-search:active {
      transform: scale(0.96);
    }

    /* ==========================================================================
       16:9 SKELETON SHIMMER ANIMATION (নির্দেশ অনুযায়ী ১৬:৯)
       ========================================================================== */
    .skeleton {
      background: linear-gradient(90deg, #151515 0%, #252525 50%, #151515 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: var(--radius-md);
      will-change: background-position;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; background: #1c1c1c; }
      .card { animation: none; }
      .card:hover { transform: none; }
    }

    .banner-skeleton {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-md);
    }

    /* ১৬:৯ স্কেলিটন কার্ড */
    .card-skeleton {
      flex: 0 0 clamp(210px, 25vw, 290px);
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .grid .card-skeleton { flex: initial; width: 100%; }

    .card-skeleton-media {
      width: 100%;
      aspect-ratio: 16 / 9; /* ১৬:৯ থাম্বনেইল স্কেলিটন */
    }

    .card-skeleton-content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-line {
      height: 14px;
      border-radius: 4px;
    }

    .skeleton-line.short {
      width: 45%;
      height: 10px;
    }

    /* Empty and Error States */
    .empty-state {
      padding: clamp(32px, 6vw, 60px) 20px;
      text-align: center;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-md);
      margin: 10px 0;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .empty-state p {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-retry:hover {
      background: var(--accent-hover);
      transform: scale(1.03);
    }

    .btn-retry:active {
      transform: scale(0.96);
    }

    /* ==========================================================================
       YOUTUBE-STYLE WATCH THEATER (16:9 FIRST -> TITLE -> META -> EPISODES)
       ========================================================================== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 4, 4, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0;
      opacity: 0;
      transition: opacity var(--transition-smooth);
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      width: 100%;
      max-width: var(--watch-player-max);
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: transparent;
      padding: 0 0 60px 0;
      animation: modalPop 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Top HUD Navigation with Close Button */
    .watch-hud-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px clamp(12px, 3vw, 24px);
      background: var(--bg-base);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-subtle);
    }

    .watch-hud-brand {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .watch-hud-brand span {
      color: var(--accent);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .close-btn:hover {
      background: var(--accent);
      transform: scale(1.03);
    }

    .close-btn:active {
      transform: scale(0.96);
    }

    .close-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* 1. STRICT 16:9 VIDEO PLAYER WITH SMOOTH BUFFER SPINNER */
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      background: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
    }

    @media (min-width: 769px) {
      .video-container {
        border-radius: var(--radius-md);
        margin-top: 12px;
      }
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }

    /* Circular Video Buffer Indicator */
    .video-buffer-spinner {
      position: absolute;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
      display: none;
      z-index: 5;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 2. YOUTUBE-STYLE WATCH DETAILS DIRECTLY BELOW PLAYER */
    .watch-details {
      width: 100%;
      padding: clamp(14px, 2.5vw, 24px) clamp(12px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .watch-title {
      font-size: clamp(1.25rem, 3.2vw, 1.85rem);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .watch-meta-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .meta-channel-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .channel-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .meta-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-tag.accented {
      color: #46d369;
      font-weight: 700;
      background: rgba(70, 211, 105, 0.1);
    }

    .meta-tag-current {
      font-size: 0.82rem;
      color: #fff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 320px;
    }

    /* 3. EPISODE SELECTOR BELOW TITLE AND METADATA */
    .watch-episodes-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .episodes-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .episodes-label-row h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .episodes-count-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .episode-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 14px 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }

    .episode-selector::-webkit-scrollbar {
      height: 6px;
    }

    .episode-selector::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-pill);
    }

    .ep-pill {
      background: var(--bg-chip);
      color: var(--text-primary);
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      font-size: 0.88rem;
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), color var(--transition-fast);
      flex: 0 0 auto;
      scroll-snap-align: start;
    }

    .ep-pill:hover {
      background: var(--bg-chip-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .ep-pill:active {
      transform: scale(0.95);
    }

    .ep-pill.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      font-weight: 700;
    }

    .player-toast {
      padding: 10px 14px;
      background: rgba(229, 9, 20, 0.2);
      border-left: 3px solid var(--accent);
      color: #fff;
      font-size: 0.85rem;
      display: none;
      border-radius: var(--radius-sm);
      animation: fadeIn 0.3s ease;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .carousel-nav-btn { display: none; }
      .card { flex: 0 0 clamp(180px, 46vw, 240px); }
      .card-skeleton { flex: 0 0 clamp(180px, 46vw, 240px); }
      .trending-banner { min-height: 320px; }
      .modal { padding: 0; }
      .video-container { border-radius: 0; }
      .watch-hud-header { border-radius: 0; }
    }

    @media (max-width: 480px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .brand-logo { justify-content: center; }
      .trending-banner { min-height: 280px; height: 320px; }
      .trending-overlay { padding: 16px; }
      .btn-play-hero { width: 100%; }
      .grid { grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 14px; }
    }
  </style>
</head>
<body>

  <!-- Netflix-Style Sticky Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="javascript:void(0)" onclick="resetHomeView()" class="brand-logo" aria-label="CloudyKoko Home">
        Cloudy<span class="accent-word">Koko</span>
      </a>

      <div class="search-box">
        <div class="search-input-wrap">
          <input
            type="text"
            id="searchInput"
            placeholder="Search anime, cartoons, classics..."
            aria-label="Search cartoons by title"
            autocomplete="off"
            spellcheck="false"
          >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="Clear search">&times;</button>
        </div>
        <button id="searchBtn" type="button" aria-hidden="true" tabindex="-1">Search</button>

  </header>

  <main class="container">
    <!-- Trending Hero Section -->
    <section id="trendingSection" class="catalog-section" aria-label="Trending Feature">
      <div id="trendingWrapper" class="hero-container">
        <div class="skeleton banner-skeleton" aria-hidden="true"></div>
      </div>
    </section>

    <!-- Search Results Section -->
    <section id="searchSection" class="catalog-section" style="display: none;" aria-label="Search Results">
      <div class="search-status-bar">
        <div class="section-header" style="margin-bottom:0;">
          <h2>Search Results <span class="section-pill" id="searchCountPill">0</span></h2>
        </div>
        <button type="button" class="btn-clear-search" onclick="resetHomeView()">Close Search &times;</button>
      </div>
      <div class="grid" id="searchGrid" role="region" aria-live="polite"></div>
    </section>

    <!-- Top Cartoons Row (16:9 Cards) -->
    <section id="topSection" class="catalog-section" aria-label="Top Cartoons">
      <div class="section-header">
        <h2>Top Cartoons <span class="section-pill">Popular</span></h2>
      </div>
      <div class="row-wrapper">
        <button class="carousel-nav-btn prev" aria-label="Previous Top Cartoons" onclick="scrollRow('topGrid', -1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="horizontal-row" id="topGrid">
          <!-- 16:9 Skeleton Card Placeholders -->
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        </div>
        <button class="carousel-nav-btn next" aria-label="Next Top Cartoons" onclick="scrollRow('topGrid', 1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>
    </section>

    <!-- Recently Uploaded Row (16:9 Cards) -->
    <section id="recentSection" class="catalog-section" aria-label="Recently Uploaded">
      <div class="section-header">
        <h2>Recently Uploaded <span class="section-pill">New</span></h2>
      </div>
      <div class="row-wrapper">
        <button class="carousel-nav-btn prev" aria-label="Previous Recently Uploaded" onclick="scrollRow('recentGrid', -1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="horizontal-row" id="recentGrid">
          <!-- 16:9 Skeleton Card Placeholders -->
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>

        </div>
        <button class="carousel-nav-btn next" aria-label="Next Recently Uploaded" onclick="scrollRow('recentGrid', 1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>
    </section>
  </main>

  <!-- ==========================================================================
       YOUTUBE-STYLE WATCH THEATER MODAL (Video 16:9 First -> Title -> Meta -> Episodes)
       ========================================================================== -->
  <div class="modal" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <!-- Minimalist Top Navigation -->
      <div class="watch-hud-header">
        <div class="watch-hud-brand">
          Cloudy<span>Koko</span> Player
        </div>
        <button class="close-btn" id="closeModal" aria-label="Close video player">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          Close
        </button>
      </div>

      <!-- 1. VIDEO PLAYER FIRST: Strict 16:9 with Buffer Spinner -->
      <div class="video-container">
        <div class="video-buffer-spinner" id="videoSpinner" aria-hidden="true"></div>
        <video id="videoPlayer" controls playsinline webkit-playsinline preload="auto"></video>
      </div>

      <!-- 2. DIRECTLY BELOW: YouTube-style Details & Metadata -->
      <div class="watch-details">
        <div id="playerToast" class="player-toast" role="alert"></div>

        <!-- Prominent White Title -->
        <h1 class="watch-title" id="modalTitle">Playback</h1>

        <!-- YouTube Metadata Strip -->
        <div class="watch-meta-strip">
          <div class="meta-channel-chip">
            <span class="channel-avatar">CK</span>
            <span>CloudyKoko Animation</span>
          </div>
          <span class="meta-tag accented">HD 1080p</span>
          <span class="meta-tag" id="episodeCountBadge">0 Episodes</span>
          <span class="meta-tag meta-tag-current" id="nowPlayingMeta">Ready</span>
        </div>

        <!-- 3. EPISODE SELECTOR BELOW TITLE AND METADATA -->
        <div class="watch-episodes-section">
          <div class="episodes-label-row">
            <h3>Select Episode</h3>
            <span class="episodes-count-text">Scroll horizontally to browse</span>
          </div>
          <div class="episode-selector" id="episodeSelector" role="tablist" aria-label="Episode selector"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Preserved API endpoint contract
    const API_BASE = "https://cloudykoko-api.kynexdeveloper.workers.dev";

    function getMediaStreamUrl(fileId) {
      return `${API_BASE}/api/media/stream?file_id=${encodeURIComponent(fileId)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function scrollRow(elementId, direction) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const scrollOffset = el.clientWidth * 0.75 * direction;
      el.scrollBy({ left: scrollOffset, behavior: "smooth" });
    }

    function generate16x9Skeletons(count) {
      return Array.from({ length: count }, () => `
        <div class="card-skeleton" aria-hidden="true">
          <div class="skeleton card-skeleton-media"></div>
          <div class="card-skeleton-content">
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line short"></div>
          </div>
        </div>
      `).join("");
    }

    // Initial Catalog Loader
    async function initUserPanel() {
      const trendingWrapper = document.getElementById("trendingWrapper");
      const topGrid = document.getElementById("topGrid");
      const recentGrid = document.getElementById("recentGrid");

      trendingWrapper.innerHTML = `<div class="skeleton banner-skeleton" aria-hidden="true"></div>`;
      topGrid.innerHTML = generate16x9Skeletons(4);
      recentGrid.innerHTML = generate16x9Skeletons(4);

      try {
        const res = await fetch(`${API_BASE}/api/user/bundle`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        const raw = await res.text();
        let bundle;
        try {
          bundle = JSON.parse(raw);
        } catch {
          throw new Error(`API returned non-JSON response (HTTP ${res.status}).`);
        }

        if (!res.ok) {
          const message = bundle.message || bundle.error || `HTTP ${res.status}`;
          throw new Error(message);
        }

        renderTrending(bundle.trending);
        renderTopCartoons(bundle.topCartoons);
        renderRecentlyUploaded(bundle.recentlyUploaded);
      } catch (err) {
        const message = err && err.message ? err.message : "Unknown connection error";
        const errorHtml = `
          <div class="empty-state" role="alert">
            <p><strong>Unable to connect to CloudyKoko stream service.</strong></p>
            <p style="font-size:0.85rem; color:var(--text-subtle); margin-bottom:14px;">${escapeHtml(message)}</p>
            <button type="button" class="btn-retry" onclick="initUserPanel()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
              Try Again
            </button>
          </div>
        `;
        trendingWrapper.innerHTML = errorHtml;
        topGrid.innerHTML = `<div class="empty-state"><p>Catalog temporarily unavailable.</p></div>`;
        recentGrid.innerHTML = `<div class="empty-state"><p>Recent uploads temporarily unavailable.</p></div>`;
      }
    }

    // Hero Trending Renderer
    function renderTrending(cartoon) {
      const container = document.getElementById("trendingWrapper");
      if (!cartoon) {
        container.innerHTML = `<div class="empty-state"><p>No featured trending cartoon at the moment.</p></div>`;
        return;
      }

      const bannerUrl = cartoon.bannerMedia?.fileId
        ? getMediaStreamUrl(cartoon.bannerMedia.fileId)
        : "";

      const epCount = (cartoon.episodes || []).length;
      const titleEscaped = escapeHtml(cartoon.title || "Featured Cartoon");

      container.innerHTML = `
        <div class="trending-banner" style="background-image: url('${bannerUrl}')" role="button" tabindex="0" aria-label="Watch ${titleEscaped}">
          <div class="trending-scrim"></div>
          <div class="trending-overlay">
            <span class="trending-badge">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
              #1 Trending Now
            </span>
            <h1 class="trending-title">${titleEscaped}</h1>
            <div class="trending-meta">
              <span class="meta-highlight">98% Match</span>
              <span>•</span>
              <span>${epCount} ${epCount === 1 ? "Episode" : "Episodes"} Available</span>
            </div>
            <div class="trending-actions">
              <button type="button" class="btn-play-hero" id="heroPlayBtn" aria-label="Play ${titleEscaped}">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                Play Now
              </button>
            </div>
          </div>
        </div>
      `;

      const bannerEl = container.querySelector(".trending-banner");
      const playBtn = container.querySelector("#heroPlayBtn");

      const handlePlay = (e) => {
        e.stopPropagation();
        openCartoonPlayer(cartoon.id);
      };

      playBtn.addEventListener("click", handlePlay);
      bannerEl.addEventListener("click", handlePlay);
      bannerEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openCartoonPlayer(cartoon.id);
        }
      });
    }

    // 16:9 Cartoon Card Element
    function createCardElement(cartoon, index = 0) {
      const card = document.createElement("article");
      card.className = "card";
      card.setAttribute("tabindex", "0");
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", `Play ${cartoon.title || 'cartoon'}`);
      card.style.animationDelay = `${Math.min(index * 40, 400)}ms`;

      const thumbUrl = cartoon.thumbnailMedia?.fileId
        ? getMediaStreamUrl(cartoon.thumbnailMedia.fileId)
        : "";

      const titleEscaped = escapeHtml(cartoon.title || "Untitled");
      const epCount = (cartoon.episodes || []).length;

      card.innerHTML = `
        <div class="card-media">
          <img src="${thumbUrl}" alt="${titleEscaped}" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.style.opacity='0.2'">
          <div class="card-hover-overlay" aria-hidden="true">
            <div class="play-badge">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
        </div>
        <div class="card-content">
          <div class="card-title" title="${titleEscaped}">${titleEscaped}</div>
          <div class="card-episodes">${epCount} ${epCount === 1 ? 'Ep' : 'Eps'}</div>
        </div>
      `;

      const trigger = () => openCartoonPlayer(cartoon.id);
      card.addEventListener("click", trigger);
      card.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          trigger();
        }
      });

      return card;
    }

    function renderTopCartoons(list) {
      const grid = document.getElementById("topGrid");
      grid.innerHTML = "";
      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>No top cartoons currently available.</p></div>`;
        return;
      }
      list.forEach((c, idx) => grid.appendChild(createCardElement(c, idx)));
    }

    function renderRecentlyUploaded(list) {
      const grid = document.getElementById("recentGrid");
      grid.innerHTML = "";
      if (!list || list.length === 0) {
        grid.innerHTML = `<div class="empty-state"><p>No recently uploaded cartoons found.</p></div>`;
        return;
      }
      list.forEach((c, idx) => grid.appendChild(createCardElement(c, idx)));
    }

    // Search Logic with Smooth Debounce
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const searchClearBtn = document.getElementById("searchClearBtn");
    let searchDebounceTimer = null;

    searchBtn.addEventListener("click", executeSearch);
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        executeSearch();
      }
    });

    searchInput.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      searchClearBtn.style.display = val ? "flex" : "none";
      clearTimeout(searchDebounceTimer);
      if (!val) {
        resetHomeView();
      } else {
        searchDebounceTimer = setTimeout(executeSearch, 300);
      }
    });

    searchClearBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchClearBtn.style.display = "none";
      resetHomeView();
      searchInput.focus();
    });

    function resetHomeView() {
      const searchSection = document.getElementById("searchSection");
      const searchGrid = document.getElementById("searchGrid");
      searchSection.style.display = "none";
      searchGrid.innerHTML = "";
      document.getElementById("searchInput").value = "";
      searchClearBtn.style.display = "none";
      document.getElementById("trendingSection").style.display = "block";
      document.getElementById("topSection").style.display = "block";
      document.getElementById("recentSection").style.display = "block";
    }

    async function executeSearch() {
      const q = searchInput.value.trim();
      const searchSection = document.getElementById("searchSection");
      const searchGrid = document.getElementById("searchGrid");
      const countPill = document.getElementById("searchCountPill");

      if (!q) {
        resetHomeView();
        return;
      }

      document.getElementById("trendingSection").style.display = "none";
      document.getElementById("topSection").style.display = "none";
      document.getElementById("recentSection").style.display = "none";
      searchSection.style.display = "block";

      searchGrid.innerHTML = generate16x9Skeletons(4);
      countPill.textContent = "...";

      try {
        const res = await fetch(`${API_BASE}/api/user/search?q=${encodeURIComponent(q)}`, {
          headers: { "Accept": "application/json" }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);

        searchGrid.innerHTML = "";
        const results = data.results || [];
        countPill.textContent = results.length;

        if (results.length === 0) {
          searchGrid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <p>No cartoons found matching <strong>"${escapeHtml(q)}"</strong>.</p>
              <button type="button" class="btn-clear-search" onclick="resetHomeView()" style="margin-top:8px;">Back to Catalog</button>
            </div>
          `;
          return;
        }

        results.forEach((c, idx) => searchGrid.appendChild(createCardElement(c, idx)));
      } catch (err) {
        const message = err && err.message ? err.message : "Connection error";
        searchGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;" role="alert">
            <p>Search failed: ${escapeHtml(message)}</p>
            <button type="button" class="btn-retry" onclick="executeSearch()" style="margin-top:8px;">Retry Search</button>
          </div>
        `;
      }
    }

    // ==========================================================================
    // YOUTUBE-STYLE VIDEO CONTROLLER & FAST BUFFERING
    // ==========================================================================
    let currentActiveCartoon = null;
    const playerModal = document.getElementById("playerModal");
    const videoPlayer = document.getElementById("videoPlayer");
    const videoSpinner = document.getElementById("videoSpinner");
    const modalTitle = document.getElementById("modalTitle");
    const episodeSelector = document.getElementById("episodeSelector");
    const playerToast = document.getElementById("playerToast");
    const episodeCountBadge = document.getElementById("episodeCountBadge");
    const nowPlayingMeta = document.getElementById("nowPlayingMeta");

    // Fast video buffer listener
    videoPlayer.addEventListener("waiting", () => { videoSpinner.style.display = "block"; });
    videoPlayer.addEventListener("loadstart", () => { videoSpinner.style.display = "block"; });
    videoPlayer.addEventListener("canplay", () => { videoSpinner.style.display = "none"; });
    videoPlayer.addEventListener("playing", () => { videoSpinner.style.display = "none"; });
    videoPlayer.addEventListener("error", () => { videoSpinner.style.display = "none"; });

    function showPlayerToast(msg) {
      playerToast.textContent = msg;
      playerToast.style.display = "block";
    }

    function hidePlayerToast() {
      playerToast.style.display = "none";
      playerToast.textContent = "";
    }

    async function openCartoonPlayer(cartoonId) {
      hidePlayerToast();
      try {
        const res = await fetch(`${API_BASE}/api/user/cartoon/${cartoonId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const cartoon = await res.json();
        currentActiveCartoon = cartoon;

        modalTitle.textContent = cartoon.title || "Cartoon Player";
        episodeSelector.innerHTML = "";

        const episodes = cartoon.episodes || [];
        episodeCountBadge.textContent = `${episodes.length} ${episodes.length === 1 ? "Episode" : "Episodes"}`;

        if (episodes.length === 0) {
          showPlayerToast("No episodes uploaded for this cartoon yet.");
          nowPlayingMeta.textContent = "No episodes available";
          playerModal.classList.add("active");
          document.body.classList.add("modal-open");
          return;
        }

        episodes.forEach((ep, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = `ep-pill ${idx === 0 ? "active" : ""}`;
          btn.textContent = `Ep ${ep.episodeNumber}: ${ep.title}`;
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", idx === 0 ? "true" : "false");
          btn.onclick = () => selectEpisode(ep, btn);
          episodeSelector.appendChild(btn);
        });

        playerModal.classList.add("active");
        document.body.classList.add("modal-open");
        playerModal.scrollTop = 0;

        selectEpisode(episodes[0], episodeSelector.children[0]);
      } catch (err) {
        alert("Unable to open playback media. Please check your connection.");
      }
    }

    // High performance fast episode loader
    function selectEpisode(ep, buttonElem) {
      hidePlayerToast();
      document.querySelectorAll(".ep-pill").forEach((b) => {
        b.classList.remove("active");
        b.setAttribute("aria-selected", "false");
      });

      if (buttonElem) {
        buttonElem.classList.add("active");
        buttonElem.setAttribute("aria-selected", "true");
        buttonElem.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
      }

      if (ep) {
        nowPlayingMeta.textContent = `Playing: Ep ${ep.episodeNumber} — ${ep.title || 'Untitled'}`;
      }

      if (ep && ep.media?.fileId) {
        videoSpinner.style.display = "block";
        videoPlayer.pause();
        videoPlayer.src = getMediaStreamUrl(ep.media.fileId);
        videoPlayer.load(); // দ্রুত বাফারিং শুরু করার জন্য ফোর্স লোড
        videoPlayer.play().catch(() => {
          // Autoplay restrictions handled smoothly
        });
      } else {
        videoSpinner.style.display = "none";
        showPlayerToast("Episode video media reference is missing.");
      }
    }

    function closeModalHandler() {
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      videoSpinner.style.display = "none";
      playerModal.classList.remove("active");
      document.body.classList.remove("modal-open");
      hidePlayerToast();
    }

    document.getElementById("closeModal").onclick = closeModalHandler;

    playerModal.addEventListener("click", (e) => {
      if (e.target === playerModal) closeModalHandler();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && playerModal.classList.contains("active")) {
        closeModalHandler();
      }
    });

    window.onload = initUserPanel;
  </script>
</body>
</html>
