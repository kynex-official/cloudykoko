<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CloudyKoko — Watch Free Cartoons Online</title>
  <meta name="description" content="Stream your favorite cartoons online in high definition on CloudyKoko.">
  <style>
    :root {
      --bg-base: #080808;
      --bg-surface: #141414;
      --bg-card: #191919;
      --bg-card-hover: #242424;
      --bg-chip: #222222;
      --bg-chip-hover: #303030;
      --accent: #e50914;
      --accent-hover: #f6121d;
      --accent-glow: rgba(229, 9, 20, 0.4);
      --text-primary: #ffffff;
      --text-muted: #b3b3b3;
      --text-subtle: #757575;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-pill: 9999px;
      --transition-fast: 180ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 280ms cubic-bezier(0.16, 1, 0.3, 1);
      --container-max: 1360px;
      --watch-player-max: 1180px;
    }

    /* Reset, GPU Performance, and Blue Tap Box Fix */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent !important;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
      background-color: var(--bg-base);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.4;
    }

    body.modal-open {
      overflow: hidden;
    }

    button, [role="button"], a {
      outline: none;
      user-select: none;
      -webkit-user-select: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 clamp(16px, 3.5vw, 40px);
    }

    /* ==========================================================================
       HEADER & SEARCH
       ========================================================================== */
    header.site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(8, 8, 8, 0.94);
      background: linear-gradient(180deg, rgba(8, 8, 8, 0.96) 0%, rgba(8, 8, 8, 0.88) 75%, transparent 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: clamp(12px, 2vw, 18px) 0;
      transition: background var(--transition-smooth);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--text-primary);
      font-size: clamp(1.25rem, 2.8vw, 1.75rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      user-select: none;
      flex-shrink: 0;
      transition: transform var(--transition-fast);
    }

    .brand-logo:hover {
      transform: scale(1.02);
    }

    .brand-logo:active {
      transform: scale(0.97);
    }

    .brand-logo .accent-word {
      color: var(--accent);
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .search-box {
      display: flex;
      align-items: center;
      position: relative;
      width: 100%;
      max-width: 480px;
      min-width: 0;
    }

    .search-input-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .search-input-wrap svg {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill var(--transition-fast), transform var(--transition-fast);
    }

    .search-box input {
      width: 100%;
      padding: 11px 40px 11px 42px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .search-box input:focus {
      background: rgba(20, 20, 20, 0.95);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-box input:focus + svg {
      fill: var(--accent);
      transform: scale(1.1);
    }

    .search-box input::placeholder {
      color: var(--text-subtle);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      transition: color var(--transition-fast), transform var(--transition-fast);
    }

    .search-clear-btn:hover {
      color: var(--text-primary);
      transform: scale(1.15);
    }

    .search-box button#searchBtn {
      display: none;
    }

    /* ==========================================================================
       BROWSE SECTIONS & CAROUSEL
       ========================================================================== */
    .catalog-section {
      margin-top: clamp(28px, 4vw, 44px);
    }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h2 {
      font-size: clamp(1.15rem, 2.2vw, 1.45rem);
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-pill {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      font-weight: 600;
    }

    /* Trending Hero Banner */
    .hero-container {
      position: relative;
      margin-top: 8px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background-color: var(--bg-surface);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
    }

    .trending-banner {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 220px;
      height: auto;
      position: relative;
      background-size: cover;
      background-position: center center;
      display: flex;
      align-items: flex-end;
      cursor: pointer;
      animation: bannerFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes bannerFade {
      from { opacity: 0; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }

    .trending-scrim {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, #080808 0%, rgba(8, 8, 8, 0.75) 45%, rgba(8, 8, 8, 0.1) 80%, transparent 100%),
        linear-gradient(to right, rgba(8, 8, 8, 0.95) 0%, rgba(8, 8, 8, 0.5) 45%, transparent 85%);
      pointer-events: none;
    }

    .trending-overlay {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: clamp(14px, 3.2vw, 36px);
      max-width: 620px;
    }

    .trending-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 12px var(--accent-glow);
      margin-bottom: 8px;
    }

    /* Optimized, cleaner & smaller Trending Title */
    .trending-title {
      font-size: clamp(1.2rem, 2.6vw, 1.85rem);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      overflow-wrap: anywhere;
    }

    .trending-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 14px;
    }

    .btn-play-hero {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--text-primary);
      color: #000;
      font-weight: 700;
      font-size: 0.92rem;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      transition: background-color var(--transition-fast), transform var(--transition-fast);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }

    .btn-play-hero:hover {
      background-color: rgba(255, 255, 255, 0.88);
      transform: scale(1.02);
    }

    .btn-play-hero:active {
      transform: scale(0.96);
    }

    .btn-play-hero svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Horizontal Carousels */
    .row-wrapper {
      position: relative;
    }

    .horizontal-row {
      display: flex;
      gap: clamp(14px, 1.8vw, 20px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 12px 0 22px 0;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-row::-webkit-scrollbar {
      height: 6px;
    }

    .horizontal-row::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-pill);
    }

    .carousel-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-60%);
      z-index: 10;
      width: 44px;
      height: 80px;
      background: rgba(0, 0, 0, 0.7);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: var(--radius-sm);
      opacity: 0;
      transition: opacity var(--transition-fast), background var(--transition-fast), transform var(--transition-fast);
    }

    .row-wrapper:hover .carousel-nav-btn {
      opacity: 1;
    }

    .carousel-nav-btn:hover {
      background: rgba(229, 9, 20, 0.85);
      transform: translateY(-60%) scale(1.05);
    }

    .carousel-nav-btn:active {
      transform: translateY(-60%) scale(0.95);
    }

    .carousel-nav-btn.prev { left: -14px; }
    .carousel-nav-btn.next { right: -14px; }

    /* ==========================================================================
       16:9 CARTOON CARD COMPONENT
       ========================================================================== */
    .card {
      position: relative;
      flex: 0 0 clamp(210px, 25vw, 290px);
      scroll-snap-align: start;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform var(--transition-smooth), box-shadow var(--transition-smooth), border-color var(--transition-smooth);
      animation: cardEnter 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.85), 0 0 12px var(--accent-glow);
      border-color: rgba(229, 9, 20, 0.5);
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #151515;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform var(--transition-smooth), opacity 0.3s ease;
      opacity: 0;
    }

    .card img.loaded {
      opacity: 1;
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card-hover-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
      opacity: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--transition-fast);
    }

    .card:hover .card-hover-overlay {
      opacity: 1;
    }

    .play-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      transform: scale(0.85);
      transition: transform var(--transition-fast);
    }

    .card:hover .play-badge {
      transform: scale(1);
    }

    .card-content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-card);
      flex: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    .card-episodes {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-episodes::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    /* Fallback for Android 7-9 browser engines without aspect-ratio support */
    @supports not (aspect-ratio: 16 / 9) {
      .trending-banner, .banner-skeleton {
        min-height: 240px;
      }
      .card-media, .card-skeleton-media, .video-container {
        position: relative;
        height: 0;
        padding-top: 56.25%;
      }
      .card-media img, .card-hover-overlay, .video-container video, .video-container .video-buffer-spinner {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    }

    /* Search Results Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(200px, 24vw, 290px), 1fr));
      gap: clamp(14px, 2vw, 20px);
      padding: 12px 0 24px 0;
    }

    .grid .card { flex: initial; }

    .search-status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn-clear-search {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border: none;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .btn-clear-search:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.02);
    }

    .btn-clear-search:active {
      transform: scale(0.96);
    }

    /* Shimmer Skeleton */
    .skeleton {
      background: linear-gradient(90deg, #151515 0%, #252525 50%, #151515 100%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: var(--radius-md);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton { animation: none; background: #1c1c1c; }
      .card { animation: none; }
      .card:hover { transform: none; }
    }

    .banner-skeleton {
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 220px;
      border-radius: var(--radius-md);
    }

    .card-skeleton {
      flex: 0 0 clamp(210px, 25vw, 290px);
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .grid .card-skeleton { flex: initial; width: 100%; }

    .card-skeleton-media {
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .card-skeleton-content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .skeleton-line {
      height: 14px;
      border-radius: 4px;
    }

    .skeleton-line.short {
      width: 45%;
      height: 10px;
    }

    /* Empty and Error States */
    .empty-state {
      padding: clamp(32px, 6vw, 60px) 20px;
      text-align: center;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border-subtle);
      border-radius: var(--radius-md);
      margin: 10px 0;
      width: 100%;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .empty-state p {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition-fast), transform var(--transition-fast);
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .btn-retry:hover {
      background: var(--accent-hover);
      transform: scale(1.03);
    }

    .btn-retry:active {
      transform: scale(0.96);
    }

    /* ==========================================================================
       YOUTUBE-STYLE WATCH THEATER MODAL
       ========================================================================== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: rgba(4, 4, 4, 1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0;
      opacity: 0;
      transition: opacity var(--transition-smooth);
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      width: 100%;
      max-width: var(--watch-player-max);
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: transparent;
      padding: 0 0 60px 0;
      animation: modalPop 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(0.98) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .watch-hud-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px clamp(12px, 3vw, 24px);
      background: var(--bg-base);
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--border-subtle);
    }

    .watch-hud-brand {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .watch-hud-brand span {
      color: var(--accent);
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: background var(--transition-fast), transform var(--transition-fast);
    }

    .close-btn:hover {
      background: var(--accent);
      transform: scale(1.03);
    }

    .close-btn:active {
      transform: scale(0.96);
    }

    .close-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Video Player (Hardware Accelerated) */
    .video-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      background: #000000;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    @media (min-width: 769px) {
      .video-container {
        border-radius: var(--radius-md);
        margin-top: 12px;
      }
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    .video-buffer-spinner {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
      display: none;
      z-index: 7;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .custom-video-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 42px 12px 12px;
      color: #fff;
      background: linear-gradient(transparent, rgba(0,0,0,.88));
      opacity: 1;
      visibility: visible;
      transition: opacity 180ms ease, visibility 180ms ease;
    }
    .custom-video-controls.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .custom-video-controls button {
      flex: 0 0 auto;
      min-width: 40px;
      min-height: 40px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: rgba(255,255,255,.14);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-video-controls button:active { transform: scale(.94); }
    .custom-video-controls .main-play { background: var(--accent); font-size: 1.1rem; }
    .seek-label { font-size: 11px; line-height: 1; }
    .video-progress { min-width: 0; width: 100%; flex: 1 1 auto; accent-color: var(--accent); cursor: pointer; }
    .video-time { flex: 0 0 auto; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }

    @media (max-width: 380px) {
      .custom-video-controls { gap: 6px; padding: 36px 8px 8px; }
      .custom-video-controls button { min-width: 34px; min-height: 34px; }
      .video-time { font-size: 10px; }
    }

    /* Details below Video */
    .watch-details {
      width: 100%;
      padding: clamp(14px, 2.5vw, 24px) clamp(12px, 3vw, 24px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .watch-title {
      font-size: clamp(1.2rem, 3vw, 1.75rem);
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
      letter-spacing: -0.3px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .watch-meta-strip {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .meta-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meta-tag-current {
      font-size: 0.82rem;
      color: #fff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 320px;
    }

    /* Episode Selector */
    .watch-episodes-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .episodes-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .episodes-label-row h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .episodes-count-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .episode-selector {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 14px 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }

    .episode-selector::-webkit-scrollbar {
      height: 6px;
    }

    .episode-selector::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-pill);
    }

    .ep-pill {
      background: var(--bg-chip);
      color: var(--text-primary);
      padding: 9px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 600;
      font-size: 0.88rem;
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast), color var(--transition-fast);
      flex: 0 0 auto;
      scroll-snap-align: start;
    }

    .ep-pill:hover {
      background: var(--bg-chip-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .ep-pill:active {
      transform: scale(0.95);
    }

    .ep-pill.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
      font-weight: 700;
    }

    .player-toast {
      padding: 10px 14px;
      background: rgba(229, 9, 20, 0.2);
      border-left: 3px solid var(--accent);
      color: #fff;
      font-size: 0.85rem;
      display: none;
      border-radius: var(--radius-sm);
      animation: fadeIn 0.3s ease;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .carousel-nav-btn { display: none; }
      .card { flex: 0 0 clamp(180px, 46vw, 240px); }
      .card-skeleton { flex: 0 0 clamp(180px, 46vw, 240px); }
      .trending-banner { min-height: 200px; height: auto; aspect-ratio: 16 / 9; }
      .modal { padding: 0; overscroll-behavior: contain; }
      .modal-content { min-height: 0; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)); }
      .video-container { border-radius: 0; flex-shrink: 0; }
      .watch-hud-header { border-radius: 0; }
    }

    @media (max-width: 480px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }
      .brand-logo { justify-content: center; }
      .trending-banner { min-height: 180px; height: auto; aspect-ratio: 16 / 9; }
      .trending-overlay { padding: 14px; }
      .btn-play-hero { width: 100%; }
      .grid { grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 14px; }
    }
  </style>
</head>
<body>

  <!-- Netflix-Style Sticky Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="javascript:void(0)" onclick="resetHomeView()" class="brand-logo" aria-label="CloudyKoko Home">
        Cloudy<span class="accent-word">Koko</span>
      </a>

      <div class="search-box">
        <div class="search-input-wrap">
          <input
            type="text"
            id="searchInput"
            placeholder="Search shows, cartoons..."
            aria-label="Search cartoons by title"
            autocomplete="off"
            spellcheck="false"
          >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="Clear search">&times;</button>

  <main class="container">
    <!-- Trending Hero Section -->
    <section id="trendingSection" class="catalog-section" aria-label="Trending Feature">

        <div class="skeleton banner-skeleton" aria-hidden="true"></div>

    <!-- Search Results Section -->
    <section id="searchSection" class="catalog-section" style="display: none;" aria-label="Search Results">
      <div class="search-status-bar">
        <div class="section-header" style="margin-bottom:0;">
          <h2>Search Results <span class="section-pill" id="searchCountPill">0</span></h2>
        </div>
        <button type="button" class="btn-clear-search" onclick="resetHomeView()">Close Search &times;</button>
      </div>
      <div class="grid" id="searchGrid" role="region" aria-live="polite"></div>
    </section>

    <!-- Top Cartoons Row (16:9 Cards) -->
    <section id="topSection" class="catalog-section" aria-label="Top Cartoons">
      <div class="section-header">

      </div>
      <div class="row-wrapper">
        <button class="carousel-nav-btn prev" aria-label="Previous Top Cartoons" onclick="scrollRow('topGrid', -1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="horizontal-row" id="topGrid">

              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        </div>
        <button class="carousel-nav-btn next" aria-label="Next Top Cartoons" onclick="scrollRow('topGrid', 1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>

    <!-- Recently Uploaded Row (16:9 Cards) -->
    <section id="recentSection" class="catalog-section" aria-label="Recently Uploaded">
      <div class="section-header">

      <div class="row-wrapper">
        <button class="carousel-nav-btn prev" aria-label="Previous Recently Uploaded" onclick="scrollRow('recentGrid', -1)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <div class="horizontal-row" id="recentGrid">
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">
              <div class="skeleton skeleton-line"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
          <div class="card-skeleton" aria-hidden="true">
            <div class="skeleton card-skeleton-media"></div>
            <div class="card-skeleton-content">

  </main>

  <!-- Watch Theater Modal -->
  <div class="modal" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="watch-hud-header">
        <div class="watch-hud-brand">
          Cloudy<span>Koko</span>
        </div>
        <button class="close-btn" id="closeModal" aria-label="Close video player">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <!-- 16:9 Hardware-Accelerated Video Player -->
      <div class="video-container">
        <div class="video-buffer-spinner" id="videoSpinner" aria-hidden="true"></div>
        <video 
          id="videoPlayer" 
          playsinline 
          webkit-playsinline 
          x5-playsinline 
          preload="auto"
        ></video>
        <div class="custom-video-controls" id="customVideoControls" aria-label="Video controls">
          <button type="button" id="seekBackBtn" aria-label="Rewind 10 seconds" title="10 seconds back"><span class="seek-label">↶ 10s</span></button>
          <button type="button" id="playPauseBtn" class="main-play" aria-label="Play" title="Play">▶</button>
          <button type="button" id="seekForwardBtn" aria-label="Forward 10 seconds" title="10 seconds forward"><span class="seek-label">10s ↷</span></button>
          <input type="range" id="videoProgress" class="video-progress" min="0" max="1000" value="0" step="1" aria-label="Video progress">
          <span id="videoTime" class="video-time">0:00 / 0:00</span>

      <!-- Details & Metadata -->
      <div class="watch-details">
        <div id="playerToast" class="player-toast" role="alert"></div>

        <h1 class="watch-title" id="modalTitle">Playback</h1>

        <div class="watch-meta-strip">
          <span class="meta-tag" id="episodeCountBadge">0 Episodes</span>
          <span class="meta-tag meta-tag-current" id="nowPlayingMeta">Ready</span>
        </div>

        <div class="watch-episodes-section">
          <div class="episodes-label-row">
            <h3>Select Episode</h3>
            <span class="episodes-count-text">Scroll horizontally to browse</span>
          </div>
          <div class="episode-selector" id="episodeSelector" role="tablist" aria-label="Episode selector"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Preserved API endpoint contract
    var API_BASE = "https://cloudykoko-api.kynexdeveloper.workers.dev";

    function getMediaStreamUrl(fileId) {
      return API_BASE + "/api/media/stream?file_id=" + encodeURIComponent(fileId);
    }

    // Android 7+ backward compatible escapeHtml
    function escapeHtml(value) {
      var val = (value !== null && value !== undefined) ? String(value) : "";
      return val.replace(/[&<>"']/g, function(ch) {
        return {
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[ch];
      });
    }

    function scrollRow(elementId, direction) {
      var el = document.getElementById(elementId);
      if (!el) return;
      var scrollOffset = el.clientWidth * 0.75 * direction;
      if (typeof el.scrollBy === "function") {
        try {
          el.scrollBy({ left: scrollOffset, behavior: "smooth" });
        } catch (e) {
          el.scrollLeft += scrollOffset;
        }
      } else {
        el.scrollLeft += scrollOffset;
      }
    }

    function generate16x9Skeletons(count) {
      var html = "";
      for (var i = 0; i < count; i++) {
        html += '<div class="card-skeleton" aria-hidden="true">' +
          '<div class="skeleton card-skeleton-media"></div>' +
          '<div class="card-skeleton-content">' +
            '<div class="skeleton skeleton-line"></div>' +
            '<div class="skeleton skeleton-line short"></div>' +
          '</div>' +
        '</div>';
      }
      return html;
    }

    // Initial Catalog Loader
    async function initUserPanel() {
      var trendingWrapper = document.getElementById("trendingWrapper");
      var topGrid = document.getElementById("topGrid");
      var recentGrid = document.getElementById("recentGrid");

      trendingWrapper.innerHTML = '<div class="skeleton banner-skeleton" aria-hidden="true"></div>';
      topGrid.innerHTML = generate16x9Skeletons(4);
      recentGrid.innerHTML = generate16x9Skeletons(4);

      try {
        var res = await fetch(API_BASE + "/api/user/bundle", {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        var raw = await res.text();
        var bundle;
        try {
          bundle = JSON.parse(raw);
        } catch (e) {
          throw new Error("API returned non-JSON response (HTTP " + res.status + ").");
        }

        if (!res.ok) {
          var message = bundle.message || bundle.error || ("HTTP " + res.status);
          throw new Error(message);
        }

        renderTrending(bundle.trending);
        renderTopCartoons(bundle.topCartoons);
        renderRecentlyUploaded(bundle.recentlyUploaded);
      } catch (err) {
        var msg = (err && err.message) ? err.message : "Unknown connection error";
        var errorHtml = 
          '<div class="empty-state" role="alert">' +
            '<p><strong>Unable to connect to CloudyKoko stream service.</strong></p>' +
            '<p style="font-size:0.85rem; color:var(--text-subtle); margin-bottom:14px;">' + escapeHtml(msg) + '</p>' +
            '<button type="button" class="btn-retry" onclick="initUserPanel()">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>' +
              ' Try Again' +
            '</button>' +
          '</div>';
        trendingWrapper.innerHTML = errorHtml;
        topGrid.innerHTML = '<div class="empty-state"><p>Catalog temporarily unavailable.</p></div>';
        recentGrid.innerHTML = '<div class="empty-state"><p>Recent uploads temporarily unavailable.</p></div>';
      }
    }

    // Hero Trending Renderer
    function renderTrending(cartoon) {
      var container = document.getElementById("trendingWrapper");
      if (!cartoon) {
        container.innerHTML = '<div class="empty-state"><p>No featured trending cartoon at the moment.</p></div>';
        return;
      }

      var bannerUrl = (cartoon.bannerMedia && cartoon.bannerMedia.fileId)
        ? getMediaStreamUrl(cartoon.bannerMedia.fileId)
        : "";

      var epCount = (cartoon.episodes || []).length;
      var titleEscaped = escapeHtml(cartoon.title || "Featured Cartoon");

      container.innerHTML = 
        '<div class="trending-banner" style="background-image: url(\'' + bannerUrl + '\')" role="button" tabindex="0" aria-label="Watch ' + titleEscaped + '">' +
          '<div class="trending-scrim"></div>' +
          '<div class="trending-overlay">' +
            '<span class="trending-badge">' +
              '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> ' +
              '#1 Trending Now' +
            '</span>' +
            '<h1 class="trending-title">' + titleEscaped + '</h1>' +
            '<div class="trending-meta">' +
              '<span>' + epCount + ' ' + (epCount === 1 ? 'Episode' : 'Episodes') + ' Available</span>' +
            '</div>' +
            '<div class="trending-actions">' +
              '<button type="button" class="btn-play-hero" id="heroPlayBtn" aria-label="Play ' + titleEscaped + '">' +
                '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' +
                'Play Now' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      var bannerEl = container.querySelector(".trending-banner");
      var playBtn = container.querySelector("#heroPlayBtn");

      var handlePlay = function(e) {
        e.stopPropagation();
        openCartoonPlayer(cartoon.id);
      };

      playBtn.addEventListener("click", handlePlay);
      bannerEl.addEventListener("click", handlePlay);
      bannerEl.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openCartoonPlayer(cartoon.id);
        }
      });
    }

    // 16:9 Cartoon Card Element
    function createCardElement(cartoon, index) {
      if (typeof index !== "number") index = 0;
      var card = document.createElement("article");
      card.className = "card";
      card.setAttribute("tabindex", "0");
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Play " + (cartoon.title || "cartoon"));
      card.style.animationDelay = Math.min(index * 35, 300) + "ms";

      var thumbUrl = (cartoon.thumbnailMedia && cartoon.thumbnailMedia.fileId)
        ? getMediaStreamUrl(cartoon.thumbnailMedia.fileId)
        : "";

      var titleEscaped = escapeHtml(cartoon.title || "Untitled");
      var epCount = (cartoon.episodes || []).length;

      card.innerHTML = 
        '<div class="card-media">' +
          '<img src="' + thumbUrl + '" alt="' + titleEscaped + '" loading="lazy" decoding="async" onload="this.classList.add(\'loaded\')" onerror="this.style.opacity=\'0.2\'">' +
          '<div class="card-hover-overlay" aria-hidden="true">' +
            '<div class="play-badge">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-content">' +
          '<div class="card-title" title="' + titleEscaped + '">' + titleEscaped + '</div>' +
          '<div class="card-episodes">' + epCount + ' ' + (epCount === 1 ? 'Ep' : 'Eps') + '</div>' +
        '</div>';

      var trigger = function() { openCartoonPlayer(cartoon.id); };
      card.addEventListener("click", trigger);
      card.addEventListener("keydown", function(e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          trigger();
        }
      });

      return card;
    }

    function renderTopCartoons(list) {
      var grid = document.getElementById("topGrid");
      grid.innerHTML = "";
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><p>No top cartoons currently available.</p></div>';
        return;
      }
      for (var i = 0; i < list.length; i++) {
        grid.appendChild(createCardElement(list[i], i));
      }
    }

    function renderRecentlyUploaded(list) {
      var grid = document.getElementById("recentGrid");
      grid.innerHTML = "";
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><p>No recently uploaded cartoons found.</p></div>';
        return;
      }
      for (var i = 0; i < list.length; i++) {
        grid.appendChild(createCardElement(list[i], i));
      }
    }

    // Search Logic with Smooth Debounce
    var searchInput = document.getElementById("searchInput");
    var searchBtn = document.getElementById("searchBtn");
    var searchClearBtn = document.getElementById("searchClearBtn");
    var searchDebounceTimer = null;

    searchBtn.addEventListener("click", executeSearch);
    searchInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        executeSearch();
      }
    });

    searchInput.addEventListener("input", function(e) {
      var val = e.target.value.trim();
      searchClearBtn.style.display = val ? "flex" : "none";
      clearTimeout(searchDebounceTimer);
      if (!val) {
        resetHomeView();
      } else {
        searchDebounceTimer = setTimeout(executeSearch, 280);
      }
    });

    searchClearBtn.addEventListener("click", function() {
      searchInput.value = "";
      searchClearBtn.style.display = "none";
      resetHomeView();
      searchInput.focus();
    });

    function resetHomeView() {
      var searchSection = document.getElementById("searchSection");
      var searchGrid = document.getElementById("searchGrid");
      searchSection.style.display = "none";
      searchGrid.innerHTML = "";
      document.getElementById("searchInput").value = "";
      searchClearBtn.style.display = "none";
      document.getElementById("trendingSection").style.display = "block";
      document.getElementById("topSection").style.display = "block";
      document.getElementById("recentSection").style.display = "block";
    }

    async function executeSearch() {
      var q = searchInput.value.trim();
      var searchSection = document.getElementById("searchSection");
      var searchGrid = document.getElementById("searchGrid");
      var countPill = document.getElementById("searchCountPill");

      if (!q) {
        resetHomeView();
        return;
      }

      document.getElementById("trendingSection").style.display = "none";
      document.getElementById("topSection").style.display = "none";
      document.getElementById("recentSection").style.display = "none";
      searchSection.style.display = "block";

      searchGrid.innerHTML = generate16x9Skeletons(4);
      countPill.textContent = "...";

      try {
        var res = await fetch(API_BASE + "/api/user/search?q=" + encodeURIComponent(q), {
          headers: { "Accept": "application/json" }
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.message || ("HTTP " + res.status));

        searchGrid.innerHTML = "";
        var results = data.results || [];
        countPill.textContent = results.length;

        if (results.length === 0) {
          searchGrid.innerHTML = 
            '<div class="empty-state" style="grid-column: 1 / -1;">' +
              '<p>No cartoons found matching <strong>"' + escapeHtml(q) + '"</strong>.</p>' +
              '<button type="button" class="btn-clear-search" onclick="resetHomeView()" style="margin-top:8px;">Back to Catalog</button>' +
            '</div>';
          return;
        }

        for (var i = 0; i < results.length; i++) {
          searchGrid.appendChild(createCardElement(results[i], i));
        }
      } catch (err) {
        var message = (err && err.message) ? err.message : "Connection error";
        searchGrid.innerHTML = 
          '<div class="empty-state" style="grid-column: 1 / -1;" role="alert">' +
            '<p>Search failed: ' + escapeHtml(message) + '</p>' +
            '<button type="button" class="btn-retry" onclick="executeSearch()" style="margin-top:8px;">Retry Search</button>' +
          '</div>';
      }
    }

    // ==========================================================================
    // LOW-SPEED SMOOTH VIDEO CONTROLLER & BUFFER MANAGEMENT
    // ==========================================================================
    var currentActiveCartoon = null;
    var playerHistoryStateActive = false;
    var closingFromHistory = false;
    var playerModal = document.getElementById("playerModal");
    var videoPlayer = document.getElementById("videoPlayer");
    var videoSpinner = document.getElementById("videoSpinner");
    var modalTitle = document.getElementById("modalTitle");
    var episodeSelector = document.getElementById("episodeSelector");
    var playerToast = document.getElementById("playerToast");
    var episodeCountBadge = document.getElementById("episodeCountBadge");
    var nowPlayingMeta = document.getElementById("nowPlayingMeta");

    var playPauseBtn = document.getElementById("playPauseBtn");
    var seekBackBtn = document.getElementById("seekBackBtn");
    var seekForwardBtn = document.getElementById("seekForwardBtn");
    var videoProgress = document.getElementById("videoProgress");
    var videoTime = document.getElementById("videoTime");
    var videoContainer = document.querySelector(".video-container");
    var isScrubbing = false;
    var controlsHideTimer = null;

    function showVideoControls() {
      var controls = document.getElementById("customVideoControls");
      controls.classList.remove("is-hidden");
      if (controlsHideTimer) clearTimeout(controlsHideTimer);
      if (!videoPlayer.paused && !videoPlayer.ended) {
        controlsHideTimer = setTimeout(function() {
          controls.classList.add("is-hidden");
        }, 4500);
      }
    }

    function toggleVideoControls() {
      var controls = document.getElementById("customVideoControls");
      if (controls.classList.contains("is-hidden")) {
        showVideoControls();
      } else {
        if (controlsHideTimer) clearTimeout(controlsHideTimer);
        controls.classList.add("is-hidden");
      }
    }

    videoContainer.addEventListener("click", function(event) {
      if (event.target.closest && event.target.closest(".custom-video-controls")) return;
      toggleVideoControls();
    });

    ["play", "playing"].forEach(function(eventName) {
      videoPlayer.addEventListener(eventName, showVideoControls);
    });

    ["pause", "ended"].forEach(function(eventName) {
      videoPlayer.addEventListener(eventName, function() {
        if (controlsHideTimer) clearTimeout(controlsHideTimer);
        document.getElementById("customVideoControls").classList.remove("is-hidden");
      });
    });

    document.getElementById("customVideoControls").addEventListener("pointerdown", showVideoControls);

    var formatVideoTime = function(value) {
      if (!isFinite(value) || value < 0) value = 0;
      var mins = Math.floor(value / 60);
      var secs = Math.floor(value % 60).toString();
      if (secs.length < 2) secs = "0" + secs;
      return mins + ":" + secs;
    };

    var updateVideoControls = function() {
      var duration = isFinite(videoPlayer.duration) ? videoPlayer.duration : 0;
      var current = isFinite(videoPlayer.currentTime) ? videoPlayer.currentTime : 0;
      playPauseBtn.textContent = videoPlayer.paused ? "▶" : "Ⅱ";
      playPauseBtn.setAttribute("aria-label", videoPlayer.paused ? "Play" : "Pause");
      playPauseBtn.title = videoPlayer.paused ? "Play" : "Pause";
      videoTime.textContent = formatVideoTime(current) + " / " + formatVideoTime(duration);
      if (!isScrubbing) {
        videoProgress.value = duration > 0 ? String(Math.round((current / duration) * 1000)) : "0";
      }
    };

    var setSpinner = function(show) {
      videoSpinner.style.display = show ? "block" : "none";
    };

    // Low-speed network stall & buffering handling
    videoPlayer.addEventListener("waiting", function() { setSpinner(true); });
    videoPlayer.addEventListener("loadstart", function() { setSpinner(true); });
    videoPlayer.addEventListener("seeking", function() { setSpinner(true); });
    videoPlayer.addEventListener("stalled", function() {
      if (!videoPlayer.paused) setSpinner(true);
    });
    videoPlayer.addEventListener("canplay", function() { setSpinner(false); });
    videoPlayer.addEventListener("canplaythrough", function() { setSpinner(false); });
    videoPlayer.addEventListener("playing", function() { setSpinner(false); updateVideoControls(); });
    videoPlayer.addEventListener("seeked", function() { setSpinner(false); updateVideoControls(); });
    videoPlayer.addEventListener("error", function() { setSpinner(false); });

    ["play", "pause", "timeupdate", "durationchange", "ended", "loadedmetadata"].forEach(function(eventName) {
      videoPlayer.addEventListener(eventName, updateVideoControls);
    });

    playPauseBtn.addEventListener("click", function() {
      if (videoPlayer.paused) {
        videoPlayer.play().catch(function() {
          showPlayerToast("Tap play again to start video.");
        });
      } else {
        videoPlayer.pause();
      }
    });

    seekBackBtn.addEventListener("click", function() {
      if (isFinite(videoPlayer.duration)) {
        videoPlayer.currentTime = Math.max(0, videoPlayer.currentTime - 10);
      }
    });

    seekForwardBtn.addEventListener("click", function() {
      if (isFinite(videoPlayer.duration)) {
        videoPlayer.currentTime = Math.min(videoPlayer.duration, videoPlayer.currentTime + 10);
      }
    });

    videoProgress.addEventListener("input", function() {
      isScrubbing = true;
      var duration = isFinite(videoPlayer.duration) ? videoPlayer.duration : 0;
      videoTime.textContent = formatVideoTime((Number(videoProgress.value) / 1000) * duration) + " / " + formatVideoTime(duration);
    });

    videoProgress.addEventListener("change", function() {
      var duration = isFinite(videoPlayer.duration) ? videoPlayer.duration : 0;
      if (duration > 0) videoPlayer.currentTime = (Number(videoProgress.value) / 1000) * duration;
      isScrubbing = false;
      updateVideoControls();
    });

    function showPlayerToast(msg) {
      playerToast.textContent = msg;
      playerToast.style.display = "block";
    }

    function hidePlayerToast() {
      playerToast.style.display = "none";
      playerToast.textContent = "";
    }

    async function openCartoonPlayer(cartoonId) {
      hidePlayerToast();
      try {
        var res = await fetch(API_BASE + "/api/user/cartoon/" + cartoonId);
        if (!res.ok) throw new Error("HTTP " + res.status);
        var cartoon = await res.json();
        currentActiveCartoon = cartoon;

        modalTitle.textContent = cartoon.title || "Cartoon Player";
        episodeSelector.innerHTML = "";

        var episodes = cartoon.episodes || [];
        episodeCountBadge.textContent = episodes.length + " " + (episodes.length === 1 ? "Episode" : "Episodes");

        if (episodes.length === 0) {
          showPlayerToast("No episodes uploaded for this cartoon yet.");
          nowPlayingMeta.textContent = "No episodes available";
          playerModal.classList.add("active");
          document.body.classList.add("modal-open");
          if (!playerHistoryStateActive) {
            history.pushState({ cloudykokoPlayer: true }, "", window.location.href);
            playerHistoryStateActive = true;
          }
          return;
        }

        episodes.forEach(function(ep, idx) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "ep-pill" + (idx === 0 ? " active" : "");
          btn.textContent = "Ep " + ep.episodeNumber + ": " + (ep.title || "Episode");
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", idx === 0 ? "true" : "false");
          btn.onclick = function() { selectEpisode(ep, btn); };
          episodeSelector.appendChild(btn);
        });

        playerModal.classList.add("active");
        document.body.classList.add("modal-open");
        playerModal.scrollTop = 0;
        if (!playerHistoryStateActive) {
          history.pushState({ cloudykokoPlayer: true }, "", window.location.href);
          playerHistoryStateActive = true;
        }

        selectEpisode(episodes[0], episodeSelector.children[0]);
      } catch (err) {
        alert("Unable to open playback media. Please check your connection.");
      }
    }

    // High performance smooth episode loader
    function selectEpisode(ep, buttonElem) {
      hidePlayerToast();
      var pills = document.querySelectorAll(".ep-pill");
      for (var i = 0; i < pills.length; i++) {
        pills[i].classList.remove("active");
        pills[i].setAttribute("aria-selected", "false");
      }

      if (buttonElem) {
        buttonElem.classList.add("active");
        buttonElem.setAttribute("aria-selected", "true");
        if (typeof buttonElem.scrollIntoView === "function") {
          try {
            buttonElem.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
          } catch(e) {
            buttonElem.scrollIntoView(false);
          }
        }
      }

      if (ep) {
        nowPlayingMeta.textContent = "Playing: Ep " + ep.episodeNumber + " — " + (ep.title || "Untitled");
      }

      if (ep && ep.media && ep.media.fileId) {
        setSpinner(true);
        videoPlayer.pause();
        videoPlayer.src = getMediaStreamUrl(ep.media.fileId);
        videoPlayer.load();
        
        var playPromise = videoPlayer.play();
        if (playPromise !== undefined) {
          playPromise.catch(function() {
            // Autoplay policies safely caught
          });
        }
      } else {
        setSpinner(false);
        showPlayerToast("Episode video media reference is missing.");
      }
    }

    function closeModalHandler(fromHistory) {
      var hadPlayerHistoryState = playerHistoryStateActive;
      playerHistoryStateActive = false;
      videoPlayer.pause();
      videoPlayer.removeAttribute("src");
      videoPlayer.load();
      setSpinner(false);
      playerModal.classList.remove("active");
      document.body.classList.remove("modal-open");
      hidePlayerToast();
      if (hadPlayerHistoryState && !fromHistory && !closingFromHistory) {
        closingFromHistory = true;
        history.back();
        window.setTimeout(function() { closingFromHistory = false; }, 150);
      }
    }

    document.getElementById("closeModal").onclick = function() { closeModalHandler(false); };
    window.addEventListener("popstate", function() {
      if (playerModal.classList.contains("active")) closeModalHandler(true);
      else playerHistoryStateActive = false;
    });

    playerModal.addEventListener("click", function(e) {
      if (e.target === playerModal) closeModalHandler(false);
    });

    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape" && playerModal.classList.contains("active")) {
        closeModalHandler(false);
      }
    });

    window.onload = initUserPanel;
  </script>
</body>
</html>
